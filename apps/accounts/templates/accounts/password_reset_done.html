{% extends "base_public.html" %}

{% block title %}Reset email sent{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[80vh] max-w-md items-center">
  <div class="form-modal-shell-compact w-full">
    <div class="form-modal-body text-center">
      <span class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600">
        <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
      </span>
      <h1 class="mt-5 text-xl font-semibold text-slate-900">Check your inbox</h1>
      <p class="mt-2 text-sm text-slate-500">If an account matches that email, we've sent password reset instructions. The link expires in 3 days.</p>
      <a href="{% url 'accounts:login' %}" class="btn-brand mt-6">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
