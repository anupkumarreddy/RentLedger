{% extends "base_public.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[80vh] max-w-md items-center">
  <div class="form-modal-shell-compact w-full">
    <div class="form-modal-body text-center">
      <span class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-600">
        <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
      </span>
      <h1 class="mt-5 text-xl font-semibold text-slate-900">Password updated</h1>
      <p class="mt-2 text-sm text-slate-500">Your password has been changed. You can now sign in with your new password.</p>
      <a href="{% url 'accounts:login' %}" class="btn-brand mt-6">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
