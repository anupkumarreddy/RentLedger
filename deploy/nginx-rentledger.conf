server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;

    location /static/ {
        alias /srv/apps/rentledger/current/staticfiles/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/apps/rentledger/media/;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/rentledger/gunicorn.sock;
    }
}
