{% comment %} Search + filter bar. Expects: search_query, search_placeholder, filters, has_active_filters {% endcomment %}
<form method="get" class="filter-bar">
  <div class="relative">
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">
      <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
    </span>
    <input type="search" name="q" value="{{ search_query }}" placeholder="{{ search_placeholder }}" class="search-input" autocomplete="off">
  </div>
  <div class="flex flex-wrap items-center gap-2">
    {% for filter in filters %}
      <select name="{{ filter.name }}" class="filter-select" onchange="this.form.submit()">
        <option value="">{{ filter.label }}</option>
        {% for opt in filter.options %}
          <option value="{{ opt.value }}"{% if opt.selected %} selected{% endif %}>{{ opt.label }}</option>
        {% endfor %}
      </select>
    {% endfor %}
    <button type="submit" class="btn-secondary btn-sm">
      <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/></svg>
      Filter
    </button>
    {% if has_active_filters %}
      <a href="{{ request.path }}" class="btn-ghost btn-sm">Clear</a>
    {% endif %}
  </div>
</form>
