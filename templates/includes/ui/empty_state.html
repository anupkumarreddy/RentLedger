<div class="empty-shell">
  <span class="flex size-12 items-center justify-center rounded-2xl bg-brand-50 text-brand-600">
    <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
  </span>
  <p class="mt-4 text-base font-semibold text-slate-900">{{ title }}</p>
  <p class="mt-1.5 max-w-md text-sm text-slate-500">{{ body }}</p>
  {% if cta_url and cta_label %}
    <a href="{{ cta_url }}" class="btn-brand mt-5"{% if cta_modal %} hx-get="{{ cta_url }}" hx-target="#modal-root" hx-swap="innerHTML"{% endif %}>{{ cta_label }}</a>
  {% endif %}
</div>
